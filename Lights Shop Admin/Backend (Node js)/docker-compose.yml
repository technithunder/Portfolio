version: "3.8"

services:
  db:
    image: "postgres:latest"
    restart: "always"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    ports:
      - "5432:5432"
    
  backend:
    build: 
      dockerfile: Dockerfile.dev
      context: .
    environment:
      DB_HOST: "db"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "postgres"
      DB_DIALECT: "postgres"
      DB_PORT: 5432
      NODE_ENV: development
    ports:
      - "5000:5000"
